# Default ref authority used by the `sdlc lease *` ops when invoked without an
# `--authority` override. The value is whatever `git fetch` / `git push`
# accepts: a remote name (`origin`), an SSH URL (`ssh://…`), an HTTPS URL
# (`https://…`), a `file://` URL, or a filesystem path (absolute or
# project-root-relative). When unset, the CLI exits 1 with a setup-pointing
# error — the lease library accepts the authority as an explicit argument, so
# callers must configure one before any `sdlc lease` command can talk to the
# ref source. This is a minimal slice-1 surface; the richer
# `control_plane.ref_authority` block from the ADR (with `type`, `address`,
# and `namespace`) is deferred to slice 2/3 when control-plane wiring lands.
# lease_authority:

# Project-root-relative directory of the `sdlc`-generated docs site — the
# Astro/Starlight app whose content `sdlc docs generate site` produces.
# Defaults to `site`. Set this to relocate the site, e.g. `sites/docs` when it
# lives under a monorepo `sites/` tree. Every site path (content root
# `<dir>/src/content/docs`, the `<dir>/site.yaml` manifest,
# `<dir>/supplemental/`, the generated sidebar
# `<dir>/src/generated/sidebar.mjs`, and the `<dir>/scripts/list-ops.ts`
# helper) is resolved beneath this directory, so consumers can host the site
# wherever they like.
# docs_site: site

# Named directories other path settings refer to as `{name}`: `repos:` entries
# and `checkout.layout`. `dev: ~/Developer` lets `repos: ['{dev}']` and
# `layout: '{dev}/{owner}/{repo}'` say it once. `~` expands and a relative
# path resolves against the project root. The machine config's `paths:`
# carries the same map and wins per name, since a directory is a fact about a
# machine. `host`, `owner` and `repo` are the layout's own tokens and cannot
# be defined here. Entries do not refer to each other.
# paths: {}

# Where this machine's repositories are. An entry that is itself a checkout
# names that repository; one that is not is searched for the checkouts under
# it, so `~/Developer` covers `~/Developer/dev` and `~/Developer/acme/api`
# alike — the search descends through directories that are not checkouts and
# stops at the ones that are. `sdlc pr review <url>` scans them for the
# checkout whose `origin` matches the URL's owner/repo, `sdlc pr survey --repo
# owner/name` for the checkout its drift is measured in, and `sdlc repo
# checkout` for a clone that is already on disk. Listing a directory here
# never puts what is under it into a verb's scope on its own: a verb that can
# fan out (`sdlc project cleanup --all`) does so only when asked, and every
# other verb stays in the repository you are standing in. An entry may use
# `{paths}` tokens; `~` expands and a relative path resolves against the
# project root, as for every other path value. The machine-level config
# (`<config-home>/sdlc/config.yaml`, key `repos`) carries the same list for
# paths that are specific to one machine and do not belong in a committed
# file; its entries are searched first.
# repos: []

# Settings for `sdlc repo checkout`, which clones a repository URL into the
# directory `layout` names. Missing block: `{dev}/{repo}` over https.
# checkout:
  # Where `sdlc repo checkout <url>` puts a checkout, as a path template.
  # Tokens: `{host}` (`github.com`), `{owner}`, `{repo}`, and every `paths:`
  # entry by name. The default `{dev}/{repo}` needs `paths.dev` and keeps
  # checkouts directly under it; `{dev}/{owner}/{repo}` groups them by owner.
  # Either works with `repos: ['{dev}']`, since the scan descends through
  # directories that are not checkouts. A token nothing defines is an error,
  # not an empty string. `~` expands and a relative result resolves against
  # the project root. The machine config's `checkout.layout` overrides this
  # one.
  # layout: '{dev}/{repo}'
  # Clone URL to build when the input names a repository without saying how to
  # reach it — a bare `owner/repo`, `github:owner/repo`. An explicit
  # `https://…` or `git@…:` input is cloned the way it was given. The machine
  # config's `checkout.protocol` overrides this one.
  # one of: https | ssh
  # protocol: https

# The sdlc log root: `sessions/` (one directory per agent session: an
# append-only `events.jsonl` and the `record.json` it reduces to),
# `runs/<run-id>/output.log` (a work run's redacted, size-capped output,
# published when the run ends) and `journal/<writer>/<yyyy-mm>.jsonl` (the
# project journal). `store.tracked` picks the root: `false` (default) is
# `.sdlc/log` in the repository's main checkout, shared by every worktree and
# gitignored; `true` is `sdlc/log` in the writing process's own project root,
# committed with the branch that wrote it (`sdlc.local.yaml` only).
# `store.path` names a root outside the project instead (an aggregate store,
# with `layout: by-project`, `sdlc.local.yaml` only). One root at a time:
# every reader and writer uses it, and sessions written to an earlier location
# are not read. Committing is opt-in; sdlc runs git there only when `sdlc log
# stage` (a pre-commit step) is wired in, and `sdlc log setup` writes the
# `.gitattributes` union-merge rule for the journal. `journal` (which writers
# append), `redact`, `capture` and the byte limits are acted on; `retention`
# is applied by `sdlc log prune`. Missing block: `.sdlc/log`, flat, untracked.
# log:
  # Where the log is stored.
  # store:
    # Whether the log is a committed part of the repository. `false`
    # (default): the root is `.sdlc/log/` in the repository's main checkout
    # (gitignored), so every git worktree shares one log and deleting a
    # worktree loses nothing. `true`: the root is `sdlc/log/` in the project
    # root of the process that writes (each worktree its own, and a session
    # records in the worktree it works in), so the log travels with the branch
    # that wrote it; it needs `sdlc log stage` as a pre-commit step and the
    # `.gitattributes` union-merge rule (`sdlc log setup`), and `sdlc project
    # doctor` fails when `sdlc/log` is gitignored. Every contributor's clone
    # would commit their hostname, user name and redacted run output, so it is
    # accepted only in `sdlc.local.yaml`. Cannot be combined with `path`.
    # tracked: false
    # A log root OUTSIDE the project (e.g. `~/agent-logs`, an absolute path,
    # or a `paths:` `{name}` token), kept untracked. Needs `layout:
    # by-project`, so two projects cannot mix ids in one directory, and is
    # accepted only in `sdlc.local.yaml`. A relative path inside the project
    # is not accepted: `tracked` picks between the two in-project roots. Not
    # allowed with `tracked: true`.
    # path:
    # `flat`: `<root>/sessions/<id>/`. `by-project`:
    # `<path>/<owner>/<repo>/sessions/<id>/`, keyed by the checkout's `origin`
    # remote and needing an external `path`; a checkout with no readable
    # `origin` is an error, not a guess. An aggregate repo collecting logs
    # across projects uses `by-project`.
    # one of: flat | by-project
    # layout: flat
  # What a session records beyond its lifecycle events.
  # capture:
    # Record per-session activity metadata in `<session>/activity.jsonl`:
    # turns, tool name and target, duration, subagents, compaction, permission
    # waits. Off, no activity is written and the content switches below have
    # nothing to attach to. Lifecycle events are always recorded.
    # activity: true
    # Record prompt text in the activity log (redacted; large text goes to a
    # blob), and keep a launch prompt's text in the session's `launched`
    # event. Off, the launch event stores no prompt text. Needs `activity` for
    # the activity log.
    # prompts: false
    # Record assistant message text in the activity log: each turn's last
    # message, a subagent's last message and permission notices (redacted;
    # large text goes to a blob). Also lets a headless run keep its output in
    # `log.txt` (with `tool_output`: either one). Needs `activity` for the
    # activity log.
    # messages: false
    # Record tool-call arguments in the activity log (redacted; large text
    # goes to a blob). Needs `activity`.
    # tool_args: false
    # Record tool output, and the text of a tool failure, in the activity log
    # (redacted; large text goes to a blob). Needs `activity`.
    # tool_output: false
    # Record who started each session or run and from where: the git
    # `user.name` in the launch directory (else the OS login) as `startedBy` /
    # `started_by`, and the machine's `os.hostname()` as `hostname`, on the
    # `launched` event, `record.json` and the journal's `run.start`. Real
    # names and hostnames: a team that commits the store publishes them. Off,
    # `startedBy` is `null` and `hostname` is left out; the time zone and the
    # derived machine id (a hash, not the hostname) are still recorded.
    # originator: true
    # When a session ends, write a redacted copy of the harness's own
    # transcript (and Claude's subagent transcripts) to `<session>/raw/`,
    # every string value redacted, up to 64 MiB per file. Transcripts hold
    # every prompt and tool output, so `sdlc project doctor` warns when this
    # is on together with a store path outside the project.
    # raw_transcript: false
  # Which writers append to the journal. Setting the environment variable
  # `SDLC_LOG_JOURNAL=off` stops a process writing it at all (the test harness
  # sets it for spawned CLIs).
  # journal:
    # Journal `op.start`/`op.end` for every top-level `sdlc` command.
    # ops: true
    # Journal `session.started`, `session.state_changed` and `session.ended`.
    # sessions: true
    # Journal `run.start`/`run.end`, `step.*`, `dispatch.decision`,
    # `define.intent_changed` and `friction.recorded`. (`pr.merged`, the
    # record of an automated merge, is always journaled and has no switch.)
    # workflow: true
  # Redaction applied to everything written to the log.
  # redact:
    # Patterns added to the built-in secret filter, never replacing it.
    # Applied to every string written to the log.
    # extra_patterns: []
    # More environment variable names whose values are always redacted.
    # Applied to every string written to the log.
    # env_names: []
  # How long the log keeps things. `record.json` and `events.jsonl` are never
  # pruned.
  # retention:
    # Age after which activity logs are pruned. Positive days, or null to keep
    # forever. Applied by `sdlc log prune`.
    # activity_days: 90
    # Age after which raw transcript copies are pruned. Positive days, or null
    # to keep forever. Applied by `sdlc log prune`.
    # raw_days: 30
    # Age after which journal files are pruned. Positive days, or null to keep
    # forever. Applied by `sdlc log prune`.
    # journal_days: null
    # Age after which a work run's published output (`runs/<run-id>/`) is
    # pruned; the journal events stay. Positive days, or null to keep forever.
    # Applied by `sdlc log prune`.
    # runs_days: 90
  # Largest content value kept inline in an activity line; larger goes to
  # `<session>/blobs/<sha256>.txt`.
  # max_inline_bytes: 4096
  # Largest blob written; larger content is cut at this size with a marker and
  # flagged `truncated`. At least `max_inline_bytes`.
  # max_blob_bytes: 1048576
lease_authority: origin
