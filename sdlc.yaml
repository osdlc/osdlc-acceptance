# yaml-language-server: $schema=docs/schema/sdlc.schema.json
# Per-project SDLC configuration, written by `sdlc init`. Only detected
# verbs are set; every other section is commented out at its default, with
# its description. `sdlc config list` shows effective values, `sdlc config
# explain <key>` documents one key, and `sdlc config set <key> <value>` edits
# this file in place.

# ── lifecycle ───────────────────────────────────────────────────────────────

# Named lifecycle-stage workflows: implement, check, judge, pr-review,
# pr-respond, pr-update, close-out, define (`lib/config/workflows.ts`'s
# `BUILTIN_WORKFLOWS`), plus any project-defined name — including the
# `setup`/`setup-hooks`/`check` baseline names that used to live under their
# own `verbs:` section, retired: everything lives here now, resolved via
# `resolveWorkflow(name, projectRoot)`. A step is `{skill}`, `{run}`,
# `{script}`, `{prompt}`, or a bare string (sugar for `{script: <string>}` — a
# verb's old shell-command list is spelled identically, just under this key).
# A `{script}` step may set `process_group: false`: the orchestrator otherwise
# runs it in its own process group and session, with no controlling terminal,
# so a `/dev/tty` prompt fails there (`sdlc run` keeps the terminal either
# way). Every built-in name ships a default step list IN CODE, not here — this
# map only carries PROJECT overrides. An entry replaces the built-in outright
# (a bare array, or an object's `steps` key — the two are equivalent), or
# wraps it with `prepend`/`append` step lists; setting both a full list and
# `prepend`/`append` on one entry fails validation. A `{run: <name>}` step
# splices in ANOTHER workflow's already-resolved steps, recursively
# (cycle-guarded) — not a verb lookup. An entry may also set `profile` or
# `tool` (exactly one) and `host` with no `steps` at all — the one place a
# workflow's binding and host live, read by `resolveWorkflow` and dispatched
# by the orchestrate loop and `sdlc session launch` alike (see
# `WorkflowEntryObjectSchema`'s own doc). `profile` names a `profiles:` entry;
# `tool` is a reference such as `codex` or `claude/opus@high`, or a wildcard
# such as `*/max` (quoted in YAML), which expands through
# `router.chains.order` or the built-in order. An unattended dispatch (`sdlc
# orchestrate`, `sdlc run <workflow>`) always launches headless: a profile
# skips an entry sdlc cannot launch headless, and a `tool` that cannot is
# rejected before any step runs. `engine` was removed in favour of these two
# keys. An unknown key on an entry is ignored with a warning, but a step with
# an unknown key fails the load: a step is a command that runs, so a typo is
# never dropped. A name absent from this map, and not one of the eight
# built-ins, resolves to an empty step list. This section is data only: it
# carries no runner logic, so `sdlc session launch` and a later flowline
# runner can execute the same resolved list.
# workflows: {}
# Baseline names: setup, setup-hooks, check. setup-hooks absent
# falls back to setup; an explicit [] means nothing. Example:
# workflows:
#   setup:
#     - bun install
#   check:
#     - bun test

# Settings for `sdlc verify changes`, which checks a changeset against every
# instruction file (`CLAUDE.md`/`AGENTS.md`) and standard whose scope encloses
# a changed file. A directory beneath the project root may carry its own
# `sdlc.yaml` whose `verify:` block shallow-merges over this one for rule
# sources scoped inside it. Only `profile`, `tool`, and `timeout_ms` nest, and
# `profile`/`tool` are one binding: a block that sets either replaces both of
# the parent's. `concurrency` and `exclude` govern the whole run, and
# `blocking`/`severity_floor` are the project defaults for one process exit
# code (a standard may override them for its own findings with
# `enforcement`/`severity_floor`), so a subtree cannot opt itself out of a
# blocking run.
# verify:
  # Name of the `profiles:` entry whose headless agent `sdlc verify changes`
  # dispatches each judgement to, translated through `@sksizer/agent-call`.
  # Set this or `tool`, not both; with neither set, verify uses
  # `profiles.default` (built in as `["*/standard"]`). The tool must be one
  # agent-call has an adapter for (claude, codex, antigravity, opencode) and
  # its CLI must be on PATH; one that is not installed fails every job rather
  # than silently passing.
  # profile:
  # Tool reference (`tool[/model][@effort]`, e.g. `claude/haiku@low` or
  # `codex`) whose headless agent `sdlc verify changes` dispatches each
  # judgement to, or a wildcard (`*/max`, quoted in YAML) that walks every
  # tool in `router.chains.order` or the built-in order. Set this or
  # `profile`, not both. A bare tool name uses the tool's own default model.
  # Verification fans out one call per governing rule source, so a small fast
  # model is usually the right trade. The tool must be one agent-call has an
  # adapter for (claude, codex, antigravity, opencode) and its CLI must be on
  # PATH.
  # tool:
  # Ceiling on judgement calls in flight, not a target — a run never opens
  # more than it planned. Purely a rate limit: verification is read-only and
  # no job mutates the working tree, so jobs cannot conflict. Coupled to
  # `max_files_per_job`, and the coupling decides whether sharding helps: a
  # judgement costs about the same wall clock whatever its prompt size, so a
  # run costs roughly `ceil(jobs / concurrency)` of them. Measured on a
  # 63-file branch: 12 jobs at a cap of 6 took 190s, 30 shards at a cap of 12
  # took 253s, and those same 30 at a cap of 32 took 155s. Lower it if the
  # engine rate-limits, but lowering it below the planned job count is what
  # makes sharding cost more than it saves.
  # concurrency: 32
  # Whether findings at or above `severity_floor` make `sdlc verify changes`
  # exit non-zero. Default false: the run reports and gets out of the way,
  # which is the right posture until a project trusts its rule corpus enough
  # to gate on it. This is the project default only: a standard that sets
  # `enforcement: block` still blocks its own findings when this is false, and
  # one that sets `enforcement: advise` never blocks when this is true.
  # blocking: false
  # Least serious finding that can fail a blocking run. `violation` (the
  # change contradicts a rule) only; `tension` also admits
  # defensible-but-contrary changes; `drift` admits everything. Applies to
  # findings that follow the project, so it has no effect on them when
  # `blocking` is false; a standard with `enforcement: block` uses its own
  # `severity_floor` (this one when it sets none), whether or not `blocking`
  # is on.
  # one of: violation | tension | drift
  # severity_floor: violation
  # Glob patterns removed from the changeset before rule sources are selected.
  # Use for generated or vendored paths that no rule meaningfully governs. A
  # rule source left with no files is dropped and costs nothing.
  # exclude: []
  # Prompt size, in bytes, past which a judgement is reported as oversized.
  # Advisory: nothing is truncated and no job is skipped, because dropping
  # files silently is a worse failure than a degraded judgement. It exists
  # because a judge asked about two hundred files reasons worse about each one
  # than a judge asked about five, and nothing else surfaces that — you get
  # vaguer findings and no signal that scope caused it. With
  # `max_files_per_job` sharding a wide source into slices, this is now a
  # backstop rather than the primary control: it trips on a job whose few
  # files are individually enormous, which sharding by file count cannot
  # prevent. Set 0 to disable.
  # max_prompt_bytes: 400000
  # Largest number of changed files one judgement may carry. A rule source
  # governing more is split into that-many-file shards, each judged against
  # the same rules and dispatched concurrently. The binding constraint is
  # attention, not context: a judge handed sixty diffs reasons worse about
  # each one than a judge handed a dozen, well before any window fills, and
  # the sixty-file job also sets the run's wall clock because everything else
  # finishes while it is still reading. Findings are attributed to the rule
  # source, not the shard, so a split is invisible in the report. Set 0 to
  # disable sharding.
  # max_files_per_job: 12
  # Per-judgement wall clock in milliseconds. Applied by
  # `@sksizer/agent-call`, which no agent CLI provides itself. Generous
  # because a job that times out contributes no findings at all, which reads
  # as a clean pass from the rule source that produced it. Applies per
  # judgement, so a sharded source gets this budget for each of its slices
  # rather than sharing one. A timeout degrades the run rather than failing
  # it: an unreachable agent is not evidence of a violation.
  # timeout_ms: 600000

# Settings for the `sdlc lib` commands, which inspect a library package before
# it is published.
# lib:
  # More file names (`*` globs, matched against the base name) that `sdlc lib
  # history` treats as boilerplate, on top of its built-in list of licence,
  # ignore and formatter files. Name the project's own per-package tool files
  # here (a build or lint config every package carries), so a move that
  # carries one is not followed into another package's history.
  # `--boilerplate` adds more for one run.
  # boilerplate: []

# The `sdlc` chain (capture → triage → define → ready → implement → check →
# judge → review → respond → merge → close-out): a fixed, ordered 11-stage
# pipeline (`lib/config/chain.ts`'s `CHAIN_STAGE_NAMES`), each bound to a
# built-in workflow or explicitly `null` for a checkpoint stage — see
# [[D-0019-sdlc-chain-stages-and-labels]] for the full stage table and
# rationale. `resolveChain(projectRoot)` returns the effective 11-entry
# binding list, each stage tagged with the layer (`project`/`local`/`default`)
# that produced it. `stages` lets a project override one stage's bound
# workflow; it can never change the stage list itself.
# chain:
  # Per-stage override of `lib/config/chain.ts`'s `DEFAULT_CHAIN_BINDINGS`,
  # keyed by one of the 11 fixed stage names (`capture`, `triage`, `define`,
  # `ready`, `implement`, `check`, `judge`, `review`, `respond`, `merge`,
  # `close-out`). An unknown stage name fails validation (an unknown key
  # inside a stage entry is ignored with a warning) — a project may change a
  # stage's bound workflow, never add, remove, reorder, or rename a stage.
  # stages:

# Git hooks sdlc runs, keyed by client-side hook name (`pre-commit`,
# `commit-msg`, `post-checkout`, `pre-push`, …), each resolved by
# `resolveHook` (`lib/config/hooks.ts`) and run by `sdlc hooks run <hook>`. An
# entry is a bare array (full replacement) or `{steps, prepend, append}`
# (replace vs. wrap the resolved list — `sdlc.local.yaml` wraps or replaces
# whatever `sdlc.yaml` resolved to, each step tagged with its own `{layer,
# mode}` provenance; hooks have no `env` layer and no built-in default). A
# hook step is a workflow `run`/`script` step (a git hook cannot drive a
# session, so `skill`/`prompt` are rejected — including one spliced in from a
# `run:` target) plus `when` (`always` | `deps-missing`), `on_fail` (`warn` |
# `block` | `park`), `process_group` (default `true`; `false` keeps the
# terminal for a step that prompts) and an optional `name`. A Ctrl-C or other
# signal to sdlc stops the hook: no later step runs, and nothing is parked or
# notified. Steps come from the repository, so a hook with steps to run needs
# the repo trusted (`sdlc repo trust`) and exits 21 otherwise; a hook with no
# steps exits 0 without a trust check. Editing a step list takes effect on the
# next run; adding or removing a hook name takes effect only after `sdlc
# apply` rewrites the hook shims.
# hooks:

# ── automation ──────────────────────────────────────────────────────────────

# Configures the categorized in-flight limits enforced by `/sdlc:orchestrate`
# (via `sdlc task inflight`) and the deterministic `sdlc orchestrate run
# --loop work,prs,merges` tick loop. Missing block or missing keys default to
# `limits.executor.implement: 5` (and the rest of `limits`' own defaults),
# `max_awaiting_review: 20`, `review.max_rounds: 3`, `base_health.enabled:
# true`. An empty `orchestrator: {}` block is treated the same as missing. An
# unknown key in `pr_filters` fails the load, since dropping a filter would
# widen which PRs the ticks handle. An unknown key at this level or on
# `limits`/`review`/`base_health` is ignored with a warning and does nothing:
# that covers a leftover `orchestrator.notify` block from before notification
# config moved to the top-level `notify:` section, and the retired top-level
# `orchestrator.max_implementations`.
# orchestrator:
  # Concurrency caps for the orchestrate loop, in two pools (`executor` for
  # task execution, `schedule` for scheduled runs) under an optional overall
  # `total`. A start is allowed only when its own cap, its pool's total and
  # the overall total all have room. A limit bounds sessions already running
  # from earlier passes plus sessions started this pass, not a per-pass count
  # alone (`ticks/_limits.ts`, the one shared gate/count helper every tick
  # reads through). An item blocked by a limit is not dispatched and stays
  # eligible for the next pass: it never advances a cursor, records a review
  # round, or takes a lease.
  # limits:
    # The task-execution pool: every session-starting or PR-handling dispatch
    # the orchestrate loop makes (`implement`, `pr_review`, `pr_respond`,
    # `pr_update`, `pr_merge`, `close_out`, `issues`). A start is allowed only
    # when its own cap, this pool's `total` and the overall `limits.total` all
    # have room.
    # executor:
      # Optional cap across ALL of the executor operations below combined
      # (`implement`, `pr_review`, `pr_respond`, `pr_update`, `pr_merge`,
      # `close_out`, `issues`), checked in addition to each one's own limit.
      # Unset (the default) means no executor-pool cap — each operation is
      # bounded only by its own key. Schedules are NOT counted here; they have
      # their own pool (`limits.schedule`), so a full executor pool never
      # blocks a schedule. `0` disables every executor operation outright.
      # total:
      # Hard cap on concurrent `implement` dispatches — tasks currently in the
      # `implementing` category (status `in-progress`, no open PR), read via
      # `sdlc task inflight`. Counts runs already going from earlier passes
      # plus this pass's own: the `work` tick starts each task's
      # define/implement/check/judge sequence as a detached run and returns
      # without waiting, so up to this many tasks work at once and the other
      # ticks are not held up. A live detached run counts even before `task
      # inflight` can see its worktree. At or above this limit, the `work`
      # tick starts nothing this pass, and each remaining ready task stays
      # eligible for the next one. `0` disables `implement` outright: the
      # `work` tick dispatches nothing.
      # implement: 5
      # Cap on concurrent `pr-review` dispatches (the `prs` tick's new-PR
      # path). Counted from live session records (see `log:`) tagged
      # `operation: "pr_review"` plus this pass's own dispatches
      # (`ticks/_limits.ts`). Default 2: a review is a single autonomous pass
      # over a diff, kept conservative relative to `implement`'s 5 since a
      # stuck reviewer session is easy to overlook. `0` disables `pr-review`
      # outright.
      # pr_review: 2
      # Cap on concurrent `pr-respond` dispatches (the `prs` tick's
      # NEEDS-RESPONSE/CI-FAILED path, `merges.ts`'s CONFLICTS path, and a
      # `respond` chain-stage advance from `issues.ts`). Counted across passes
      # for the Router's `fresh` route (and the direct non-Router dispatch),
      # which both go through `session launch` and leave a durable session
      # record `ticks/_limits.ts`'s `countLiveSessions` can see on a later
      # pass — but a Router `resume` delivery bypasses `session launch`
      # entirely, so a `resume` still running from an earlier pass is
      # invisible to that count (an accepted partial signal,
      # `ticks/_limits.ts`'s module doc); a `live` delivery into an
      # already-running session starts no new session and never counts at all.
      # Default 3, one above `pr_review`'s: responding to feedback is
      # typically faster per item than a full review. `0` disables
      # `pr-respond` outright.
      # pr_respond: 3
      # Cap on concurrent `pr-update` dispatches (the `merges` tick's
      # stale-branch fan-out). Counted per pass only: it is a deterministic
      # `{script}` step, not an agent session, so no `session launch` record
      # ever exists to scan for it on a later pass (`ticks/_limits.ts`'s
      # module doc). The built-in `pr-update` workflow runs `sdlc pr update
      # --pr {pr} --apply`, so each dispatch can push a rebased or merged
      # head: this cap bounds that rebase/merge work. Default 5, matching
      # `implement`'s. `0` disables the fan-out outright.
      # pr_update: 5
      # Cap on PR merges the `merges` tick performs in one pass
      # (`orchestrator.merge`, `ticks/merges.ts`). Counted per pass only: a
      # merge is a deterministic op call, not an agent session, so no session
      # record exists to scan on a later pass. Default 3: each merge moves the
      # integration branch, and the PRs queued behind it then need their own
      # base re-checked. `0` disables the merge step outright.
      # pr_merge: 3
      # Cap on concurrent `close-out` dispatches (the `merges` tick's
      # MERGED-verdict path, and a `close-out` chain-stage advance from
      # `issues.ts`). Counted from live session records (see `log:`) tagged
      # `operation: "close_out"` plus this pass's own dispatches. Default 5: a
      # close-out is a short, mostly mechanical wrap-up step. `0` disables
      # close-out outright (merged PRs are held for a later pass, not
      # dropped).
      # close_out: 5
      # Cap on concurrent chain-stage advances dispatched by the `issues`
      # tick, enforced IN ADDITION to whichever of
      # `implement`/`pr_review`/`pr_respond`/`close_out` the advanced stage's
      # own workflow counts against (`ticks/issues.ts`'s `limitedOpForStage`).
      # Counted per pass only. Default 2, matching `pr_review`'s: the issues
      # loop drives the same underlying workflows as `work`/`prs`/`merges`, so
      # this is a secondary throttle layered on top of theirs, not a
      # substitute for them. `0` disables the `issues` loop's stage advances
      # outright.
      # issues: 2
    # The schedule pool: concurrency for scheduled runs, separate from task
    # execution so a busy hour of PR work cannot starve a schedule and a
    # schedule cannot starve task work.
    # schedule:
      # Cap on schedule entries running at once (`sdlc schedule`), enforced by
      # the `schedule` loop (`ticks/schedule.ts` via `_limits.ts`'s
      # `scheduleLimitReason`). Counted from the schedule run lock and state
      # file (`services/schedule/state.ts`'s `runningEntries`), not from
      # session records, so a script-only run counts too. Default 1. There is
      # no per-entry cap because an entry never overlaps itself. The
      # `schedule` loop is not in the default `--loop`, so the cap applies
      # only when that loop runs. A running schedule counts toward the overall
      # `limits.total` that executor operations see. `0` disables schedules
      # outright.
      # total: 1
    # Optional machine-wide cap across BOTH pools: every executor operation
    # plus every running schedule entry, checked in addition to each one's own
    # cap and its pool total. Unset (the default) means no overall cap. `0`
    # disables every operation and schedule outright.
    # total:
    # How long, in minutes, a session record (see `log:`) with no `pid`, no
    # running tagged process and no recorded end still counts as a running
    # session toward the session-counted caps (`pr_review`, `pr_respond`,
    # `close_out`). A record WITH a recorded `pid` counts only while that
    # process is alive, and one without is checked against the running tagged
    # processes, so an orphan (its launcher killed before it wrote `endedAt`)
    # stops counting once the process is gone. This age bound is the fallback
    # for a record with no pid and no other signal (written before the pid was
    # stamped, or caught before the spawn, on a host that cannot be asked): it
    # counts only while younger than this, so it cannot count forever. A
    # session that declared itself `done` never counts. Default 180 (three
    # hours): longer than any single headless review/respond/close-out is
    # expected to run.
    # session_ttl_minutes: 180
  # The branch task work builds against: `/sdlc:task-work` cuts the task
  # branch from `origin/<target_branch>`, opens its PR with that as the base,
  # and takes its quality baseline against its tip. Unset means the repository
  # default branch (the remote's `origin/HEAD`, else `main`), so a repository
  # that sets nothing sees no change. The branch must exist on the remote: a
  # missing target stops the run with an error, never falls back. Set it to an
  # integration branch (e.g. `sdlc-1.0`) to run a body of work as one omnibus
  # PR; `sdlc orchestrate target` prints the resolved value.
  # target_branch:
  # The `merges` tick's merge step: it merges a reviewed task PR into an
  # allowed target once the required ledger evidence for the PR head, review
  # threads, CI and mergeability all hold (`sdlc pr merge`,
  # `lib/services/pr/ops/merge.ts`). Missing block means no merging.
  # merge:
    # Branches the `merges` tick may merge task PRs INTO. A PR whose base is
    # not listed is never merged, however green. The default is empty: the
    # orchestrator merges nothing until a project names an integration branch
    # here. `main` is merged into only when it is listed explicitly.
    # allowed_targets: []
    # Evidence-ledger step ids (`.sdlc/pr-evidence/<head_sha>.jsonl`,
    # `lib/services/pr/evidence.ts`) that must hold a passing entry for the PR
    # head before it merges. Empty by default, and an empty list is only valid
    # while `allowed_targets` is empty: setting an allow-list without naming
    # required evidence makes the config refuse to load. The ledger is the
    # single source. The configured gates are required on top of this list
    # without being named in it: every step of the `check` workflow (ids
    # `check#<index>`) and, when `verify.blocking` is on, `verify-changes` and
    # `pr-review`; a recorded failing `verify-changes` verdict from a `block`
    # standard also stops the merge. `pr-review` is the review verdict,
    # recorded by `sdlc pr review-verdict` (reasons `verdict-missing`,
    # `verdict-blocking`); any other id is a gate (`gate-not-run: <step>`,
    # `gate-failed: <step>: <detail>`).
    # required_evidence: []
    # How a task PR is merged into its target.
    # one of: squash | merge | rebase
    # method: squash
  # Informational ceiling on the count of tasks in the `awaiting-review`
  # category (status `in-progress` AND an open PR exists for
  # `task/<basename>`). When the count is at or above this limit, the
  # orchestrator's digest line records `caps-reached=max_awaiting_review` as a
  # warning so the human knows the review queue is saturated. Does NOT block
  # new implementations — awaiting-review tasks have already handed control
  # back to the human; they don't consume implementation slots.
  # max_awaiting_review: 20
  # Per-loop enable flags for `sdlc orchestrate run --loop <names>`. A name
  # not passed to --loop never runs regardless of this flag; a name that IS
  # passed but whose flag here is false is dropped from the run (absent from
  # the `loop` field of the op output) rather than run.
  # loops:
    # Whether the `work` loop (drive ready tasks through
    # implement/check/judge) may run.
    # work: true
    # Whether the `prs` loop (classify open PRs, dispatch review/respond) may
    # run.
    # prs: true
    # Whether the `merges` loop (close out merged PRs, update stale ones,
    # respond to conflicts) may run.
    # merges: true
    # Whether the `issues` loop (walk open, chain-labeled GitHub issues one
    # stage at a time up to their autonomy ceiling) may run.
    # issues: true
    # Whether the `schedule` loop (start the `schedules:` entries that are
    # due, each as a detached run) may run.
    # schedule: true
  # Default --interval (seconds) for `sdlc orchestrate run` when the flag is
  # omitted. Ignored under --once.
  # interval_seconds: 300
  # Configures how the `prs`/`merges` ticks dispatch the built-in `pr-review`
  # workflow. Missing block or missing keys default to `max_rounds: 3`, no
  # `rubric_path` (generic inlined rubric only). The model that dispatch runs
  # `pr-review` under is set at `workflows.pr-review.profile` or `.tool`, not
  # here — a static per-project value, deliberately separate from
  # `pr_review.profile`/`pr_review.tool` (the interactive `sdlc pr review`
  # binding) so an unattended review can run a different model from the one
  # the PR author used; the loop does NOT infer a model from the PR author
  # (the author is recorded in the lease and the PR footer, but this dispatch
  # does not read it yet). (An earlier `command` field here backed the OLD
  # `/sdlc:orchestrate` Step 2a opt-in review phase; that phase and its
  # `get-review-policy` op were retired when the orchestrate skill was
  # rewritten as a thin `orchestrate run` wrapper.)
  # review:
    # Cap on `prs`/`merges`-tick review/respond round-trips per PR (tracked in
    # the `review_rounds` field of the per-PR cursor) before the loop stops
    # dispatching `pr-review`/`pr-respond` for that PR and fires a
    # `pr.ci_failed` or `pr.needs_response` notification instead of looping
    # forever — repeating every tick thereafter for as long as the PR stays
    # stuck (see the `notify:` section's own event descriptions).
    # max_rounds: 3
    # Project-root-relative path to a code-review rubric doc that
    # `/sdlc:pr-review` reads in full and judges the diff against in its Step
    # 2. Unset (the default for a project that has not configured one) falls
    # back to the eight dimensions and severity scale inlined directly in the
    # skill's own prose, with no project-specific "How to apply" guidance
    # beyond that. This repository sets it to
    # `docs/planning/standards/S-0017-code-review-rubric.md`.
    # rubric_path:
    # Path (repo-relative) to a standard document (e.g.
    # `docs/planning/standards/S-0018-review-response-policy.md`) the
    # `pr-respond` skill follows when triaging review comments — fix /
    # decline-with-a-reply / verify-before-acting / minimize-churn /
    # loop-guard-at-`max_rounds`. Unset falls back to a short built-in policy
    # inlined in the skill. Read via `sdlc config get
    # orchestrator.review.response_policy`; also surfaced in the Router
    # feedback bundle (`lib/services/dispatch/feedback.ts`) as a path plus
    # one-line summary, so a resumed or live session applies it too.
    # response_policy:
  # A PR matching an `exclude_*` filter, or excluded by `include_labels` being
  # set and not matched, is skipped by the `prs`/`merges` ticks entirely — not
  # even classified — for excluding e.g. dependabot or a human-owned
  # exploratory PR from autonomous handling, or scoping the orchestrator to
  # only opted-in PRs.
  # pr_filters:
    # PR labels whose PRs the ticks skip.
    # exclude_labels: []
    # PR author logins whose PRs the ticks skip.
    # exclude_authors: []
    # Opt-in scoping: when non-empty, a PR is considered only if it carries at
    # least one of these labels — every other open PR is skipped by the
    # `prs`/`merges` ticks entirely, the same as an `exclude_*` match. Empty
    # (the default) means "all PRs", i.e. this filter is inactive. Turning a
    # busy repo's orchestrator on for the first time commonly sets this to a
    # single opt-in label (e.g. `sdlc:orchestrate`) rather than trusting
    # `exclude_*` to keep up with everything NOT meant for autonomous
    # handling. The one exception is the loop's own work: a PR whose head is
    # `task/<basename>` of a task with a work-run record (a run a `work` tick
    # started or a person dispatched with `sdlc task dispatch`; records are
    # pruned after 14 days) is in scope without the label (nothing labels the
    # PR `/sdlc:task-work` opens), and every `exclude_*` and draft rule still
    # applies to it.
    # include_labels: []
    # Skip draft PRs entirely — not even classified — in the `prs`/`merges`
    # ticks, and skip a draft PR at a `review`/`respond` chain stage in the
    # `issues` tick. Default true: a draft is a work-in-progress the author is
    # not yet asking for autonomous review/response on. `false` restores
    # pre-this-flag behavior (drafts treated like any other open PR). One
    # exception: a failed-check draft (its last recorded local check failed)
    # stays in scope of the `prs` tick so reviewer comments on it get a
    # `pr-respond`; it is never reviewed.
    # exclude_drafts: true
  # Configures the Router: the delivery fallback chain, whether the optional
  # live-send route may run, and whether the Router is wired into the
  # `prs`/`merges` ticks at all. Missing block or missing keys default to
  # enabled, `[live, resume, fresh]`, `live_enabled: false`,
  # `max_deliveries_per_pr: 20`, `quiet_period_secs: 120`,
  # `receipt_timeout_ms: 15000`.
  # router:
    # Whether the `prs`/`merges` ticks route NEEDS-RESPONSE, CI-FAILED, and
    # conflict feedback through the Router (`lib/services/dispatch/`) into a
    # PR's producing session before falling back to a fresh `pr-respond`
    # dispatch. `false` restores the old cold-dispatch-only behavior for every
    # tick, though `sdlc pr route`/`sdlc task dispatch` can still be invoked
    # manually regardless of this flag.
    # enabled: true
    # Ordered delivery fallback the Router tries for a subject with a
    # resolvable session, first list entry that succeeds wins: `live` (send
    # into a running session via whichever host opened it — `orca`/`tmux`
    # today, any host with a `send` part), `resume` (headless native resume of
    # the originating harness session with the feedback as the follow-up
    # prompt — `claude -p --resume=<id> -- <message>`, replaying the launch's
    # plugin and prompt-pin flags / `codex exec resume <id> -- <message>`),
    # `fresh` (today's cold dispatch: open a new session with the feedback as
    # the prompt via the existing `pr-respond` workflow). A route missing from
    # this list is never attempted.
    # routes: [live, resume, fresh]
    # Whether the `live` route may be attempted by the `prs`/`merges`
    # orchestrate loop. Defaults off: it is optional in the MVP and not yet
    # exercised end-to-end against a real hosted session. `false` skips
    # straight to `resume` for the loop even when `routes` lists `live` first
    # — an explicit `sdlc pr route <n> --route live` still attempts it
    # regardless, since that is a single manual op confirming the route works,
    # not the loop-wide default turning on.
    # live_enabled: false
    # Cap on entries kept in one subject's DeliveryRecord `attempts` log
    # (oldest dropped past this). Does not cap how many distinct feedback
    # items can be delivered, and does not cap the `delivered` signature map,
    # which is pruned by PR state and head SHA instead — only how much attempt
    # history is retained.
    # max_deliveries_per_pr: 20
    # Seconds the Router waits after the newest undelivered comment or review
    # before delivering, so a reviewer who leaves several comments in a row
    # gets one batch. Failing-check and conflict items never start or extend
    # the wait. `sdlc pr route --force` and `--route` skip it. `0` turns the
    # wait off.
    # quiet_period_secs: 120
    # Milliseconds the `live` route waits, after typing a message into a
    # running session, for a delivery receipt: the host confirming it, a
    # harness hook reporting the prompt (armed only when
    # `log.capture.activity` is on and the session is not mid-turn), or weaker
    # signs the agent started a turn. A receipt that never arrives while a
    # confirming signal was expected sends the delivery on to `resume`/`fresh`
    # (or holds while the session runs); with none expected, the send counts
    # as unconfirmed. `0` checks once and does not wait.
    # receipt_timeout_ms: 15000
  # The goal scope the `work` tick cuts its frontier to, so a loop runs toward
  # one release rather than the whole backlog. Dispatch order is the roadmap
  # order either way (`task next` ranks by milestone release order first);
  # this only drops what lies outside the goal. Missing block or missing keys
  # mean no scope.
  # goal:
    # Milestone ids or basenames (e.g. `M-XKFC`). When non-empty, the `work`
    # tick dispatches only tasks that belong to one of these milestones
    # (listed in its `tasks:`; failing that named in the task's `related:`;
    # failing that through its `parent_key` task); a task in no milestone is
    # skipped, unless it blocks (through `depends_on`) a task that is in
    # scope, in which case it is pulled in. Empty (the default) means no
    # milestone cut. The same cut as `sdlc task next --milestone`. A name that
    # is not an existing milestone file makes the config refuse to load.
    # milestones: []
    # Release-version ceiling (e.g. `1.0.0`). When set, the `work` tick
    # dispatches only tasks whose milestone ships at or before this version on
    # the roadmap (`## vX.Y.Z` sections of an open roadmap, else the
    # milestone's own `version:`); a task in no milestone, or in a milestone
    # with no version, is skipped (unless it blocks an in-scope task, which
    # pulls it in). Null (the default) means no ceiling. The same cut as `sdlc
    # task next --until-version`. Combined with `milestones`, a task must
    # satisfy both.
    # until_version: null
  # Configures how the `prs` tick polls open PRs. Missing block or missing
  # keys default to `full_refresh_secs: 900`.
  # polling:
    # Seconds the `prs` tick may skip the full fetch of an open PR whose
    # listed `updatedAt` has not changed since its last full fetch. A PR whose
    # last verdict was `CI-BLOCKED`, `NEEDS-RESPONSE` or `CI-FAILED`, or whose
    # checks were still pending, is always fetched, since GitHub does not bump
    # `updatedAt` for check runs or base-branch moves. `0` fetches every PR
    # every tick.
    # full_refresh_secs: 900
  # The `work` tick's pre-dispatch check of the branch tasks are cut from.
  # When the tip of `origin/<target>` fails a configured command, the tick
  # dispatches nothing new (runs already going continue) and says so once per
  # (sha, command) rather than starting runs that all fail for the same
  # reason. The verdict is cached per sha; only a real non-zero exit is cached
  # red. A failure of the check itself (a spawn error, a timeout, a failed
  # install or fetch) is never cached as red: it is retried after a short TTL
  # and reported separately, and the tick dispatches nothing until a verdict
  # exists. `sdlc orchestrate base-health skip` overrides a red verdict for
  # the current sha. Missing block or keys default to `enabled: true` with no
  # commands, which makes the check a no-op until a repo lists some.
  # base_health:
    # Whether the `work` tick checks the health of the target branch before it
    # dispatches. `false` makes the check a no-op: the tick dispatches as it
    # did before the check existed.
    # enabled: true
    # Shell commands the base-health check runs, in order, in a worktree at
    # the tip of `origin/<target>` (`.sdlc/orchestrate/base-health`); the
    # first to exit non-zero makes the base red. An explicit list, not a
    # pointer into `workflows.check`. Default: none, and with none the check
    # is a no-op that reports `unconfigured` and never holds dispatch. Editing
    # the list re-verifies the current sha: a verdict is keyed by sha and by
    # these commands.
    # commands: []
    # Seconds one whole check (the dependency install and every command
    # together, not each) may run before it gives up; the commands share what
    # the install leaves. A timeout is a failure of the check, not a red base:
    # it is never cached as red, and is retried after `infra_retry_seconds`.
    # The tick blocks for at most this long per check.
    # timeout_seconds: 900
    # Seconds to wait before running the check again for a sha whose last
    # attempt failed for a reason other than a command exiting non-zero (a
    # spawn error, a timeout, a failed install or fetch). Each consecutive
    # failure doubles the wait, up to one hour; a verdict resets it. Until a
    # verdict exists the `work` tick dispatches nothing. `0` retries on every
    # tick.
    # infra_retry_seconds: 120

# Configures how `/sdlc:pr-check` (the `pr classify` op) and the `orchestrate
# watch` pending-work gate treat review comments and submitted reviews: which
# authors are ignored as automation noise (`ignored_authors`), and how the PR
# author's own comments are treated (`author_comments`). The defaults favour
# solo-developer workflows where the PR author and the reviewer are the same
# human; teams should set `author_comments: self-notes` to filter the author's
# own comments out of the actionable-feedback signal. Missing block, missing
# key, or an unrecognised value all default to `actionable` (and an empty
# `ignored_authors`).
# pr_check:
  # `actionable` (default, solo) — author's review comments and submitted
  # reviews count as actionable feedback and can flip the verdict to
  # NEEDS-RESPONSE. `self-notes` (team) — author's comments on their own PR
  # are filtered out as notes-to-self. Automation authors (see
  # `ignored_authors`) are always excluded regardless of this setting.
  # one of: actionable | self-notes
  # author_comments: actionable
  # Project-specific automation logins whose comments and reviews never count
  # as actionable feedback (and never wake the orchestrator). The built-in set
  # `github-actions` and `cloudflare-workers-and-pages` is always applied;
  # this list ADDS to it (e.g. `vercel`, `netlify`, `dependabot`) so a new
  # project's CI/deploy bots need config, not a plugin release. Matching is
  # shape-normalized: a trailing `[bot]` suffix is stripped before comparison,
  # so an entry written as `dependabot` or `dependabot[bot]` matches both the
  # suffix-less GraphQL login (`gh pr view`) and the suffixed REST login (`gh
  # api`). Missing key or a non-array value means 'no extra authors' — the
  # built-in set still applies.
  # ignored_authors: []

# Configures the `survey` and `update` verbs: which PRs are in scope
# (`author`, `include_drafts`), how an out-of-date branch is brought up to
# date (`strategy`, `overrides`), the cases that automatically avoid a history
# rewrite (`guards`), and how conflicts are resolved without a human
# (`lockfile_install`, `resolvers`, `verify`, `repair`), and when a failed
# update is retried (`max_failed_attempts`). Every key has a default and the
# whole block is optional, so both verbs work with no config file at all.
# pr_update:
  # Only survey/update PRs by this author. `@me` is gh's own token for the
  # authenticated user. Null (the default) means every author — appropriate
  # for a solo repository, where filtering by author would hide nothing.
  # author: null
  # Whether draft PRs are surveyed and updated. Drafts drift like any other
  # branch and a draft left behind for months is exactly the case this exists
  # to surface, so they are included by default.
  # include_drafts: true
  # How an out-of-date branch is brought up to date. `rebase` (default) keeps
  # each PR's history linear and its diff exactly its own commits, which
  # matters most in a stack — a merge leaves every descendant carrying a merge
  # commit per ancestor update. `merge` never rewrites history and so never
  # needs a force-push. See `guards` for the cases that fall back to merge
  # automatically.
  # one of: rebase | merge
  # strategy: rebase
  # Per-PR strategy overrides, first match wins. A rule matches when every
  # field it declares matches. Use it to pin a protected base branch to
  # `merge`, or to let a label opt one PR out. An override beats the
  # `reviewed` and `max_rebase_commits` guards, which are preferences — it
  # does NOT beat `unpushed_local`, which exists to stop a force-push
  # destroying work and is not negotiable.
  # overrides: []
  # Automatic falls-back to `merge` (or `skip`) for the cases where rewriting
  # history costs more than the tidier tree is worth. `unpushed_local` is
  # checked first and cannot be overridden; the other two are preferences an
  # `overrides` rule may beat. Guards only ever step down from `rebase` — none
  # of them turns a `merge` into a rebase.
  # guards:
    # What to do when the head branch is checked out in another worktree that
    # holds commits the remote does not. `--force-with-lease` does NOT protect
    # against this — it compares against the remote, which is unchanged — so a
    # rebase here silently orphans work in progress. `skip` (default) leaves
    # the PR alone; `merge` updates it without rewriting history.
    # one of: skip | merge
    # unpushed_local: skip
    # What to do when a PR carries at least one submitted review. Rebasing
    # rewrites the commits review comments are anchored to, so GitHub marks
    # those threads outdated. `merge` (default) keeps them anchored.
    # one of: merge | rebase
    # reviewed: merge
    # Above this many commits ahead of base, fall back to `merge`. A rebase
    # replays every commit and can hit the same conflict once per commit,
    # while a merge resolves it once; past some length that trade stops
    # paying. 0 disables the guard.
    # max_rebase_commits: 20
  # Shell verb that rebuilds lockfiles from their manifests (`bun install`,
  # `cargo generate-lockfile`, …), run in the update worktree. A lockfile
  # conflict is resolved by taking the base side and re-running this, because
  # a lockfile is derived and the merged manifest is what it must be derived
  # from. Null (the default) means lockfile conflicts are left for a human:
  # taking a side without re-deriving would push a lockfile that disagrees
  # with its own manifest, which is worse than not updating.
  # lockfile_install: null
  # Project-specific conflict resolvers for generated artifacts, first match
  # wins. A conflict in a file a generator owns is not a judgement call — it
  # is `re-run the generator`, and the run's output is the resolution.
  # Lockfiles are handled without configuration; this is for a project's own
  # codegen (`docs/index.md` rebuilt by `make docs`, say). Every conflicted
  # path in a PR must be claimed by some rung or the update is left for a
  # human.
  # resolvers: []
  # What must pass before an updated branch is pushed. `none` (default)
  # because the deterministic tier only ever produces a merge git itself
  # resolved or an artifact a generator rebuilt, and running the project's
  # whole gate once per PR is not affordable across a 50-PR run — CI on the PR
  # is the real gate. `check` runs the host's check commands anyway, for a
  # project where a bad push is expensive. `test` runs the project's
  # explicitly configured test commands (a standalone run reads
  # `test_command`): it never falls back to detection, and when it resolves to
  # no command the update fails before touching any PR. Both are trust-gated
  # like every other project-sourced command: they need the repository trusted
  # or a one-run trust flag.
  # one of: none | check | test
  # verify: none
  # The last rung of the conflict ladder, called once per kind only when
  # nothing deterministic resolved the problem. Never called in a rehearsal
  # (no `--apply`).
  # repair:
    # Shell command run in the update worktree when no resolver fixes a
    # problem — typically an LLM call. Gets the request as JSON on stdin and
    # in `PR_UPDATE_*` variables; exit 0 claims success. It must not commit,
    # move HEAD or create refs: pr-update checks the tree, then commits and
    # pushes itself. Trust-gated like `verify: check`/`test`: needs the
    # repository trusted or a one-run trust flag. Null (the default) means no
    # repair.
    # command: null
    # Which problems the repair command is asked to fix: an unclaimed
    # `conflict`, a failed `verify` step, or both.
    # on: [conflict]
  # Skip a PR once its update has failed this many times at the same head and
  # base sha, until either moves. Failures from `--apply` runs are recorded in
  # `.pr-update/attempts.json`; a successful update clears the PR's entries. 0
  # disables the check. The retry-failed flag of `update` ignores it for one
  # run.
  # max_failed_attempts: 1

# Settings for `sdlc pr review`, which opens a pull request in a local
# worktree and starts an interactive review session there. Missing block uses
# `profiles.default` (built in as `*/standard`) in the current terminal with
# the built-in brief.
# pr_review:
  # Name of the `profiles:` entry whose coding agent `sdlc pr review` starts
  # in the PR worktree. Set this or `tool`, not both; with neither set, `sdlc
  # pr review` uses `profiles.default` (built in as `["*/standard"]`). The
  # chosen CLI must be on PATH. `--tool` overrides per run.
  # profile:
  # Tool reference (`tool[/model][@effort]`, e.g. `codex`) whose coding agent
  # `sdlc pr review` starts in the PR worktree, or a wildcard (`"*/max"`) that
  # walks every tool in `router.chains.order` or the built-in order. Set this
  # or `profile`, not both. The chosen CLI must be on PATH. `--tool` overrides
  # per run.
  # tool:
  # The author rule: when true, the review never runs on the tool that wrote
  # the PR (the author in the PR's lease and footer). With the author unknown
  # (no trusted footer), every tool may be the author's, so
  # `if_only_author_left` decides. Applies to whatever the review walks (the
  # binding, a `routing:` rule's profile, `profiles.default`) but not to
  # `--tool`: a `--tool` that lands on the author's tool runs, with a warning
  # naming both. Default false.
  # not_the_author:
  # What `not_the_author` does when only the author's tool is left:
  # `different-model` (default) takes an author-tool entry whose model differs
  # from the author's, else the next model of its tier, else the entry flagged
  # that the model may match; `wait` stops so the run can be retried later;
  # `person` stops and hands the review to a person.
  # one of: different-model | wait | person
  # if_only_author_left:
  # Where the review session opens, when it should differ from `host.default`:
  # terminal | orca | cmux | tmux | herdr | otty | wezterm | vscode |
  # jetbrains. A host whose binary is missing fails the run rather than
  # falling back.
  # one of: terminal | orca | cmux | tmux | herdr | otty | wezterm | vscode | jetbrains
  # host:
  # What `sdlc pr review` does with a PR whose head branch lives in another
  # repository (a fork), whose tree is a stranger's code. `skip-init`
  # (default): create the worktree but run no `setup` verbs there — an install
  # would execute that PR's own lifecycle scripts before anyone has read it —
  # and warn that the tree's instruction files and hooks are the PR author's.
  # `full`: treat it like a same-repo PR. `refuse`: exit with an error.
  # `--trust` runs one PR as `full` whatever this says. Same-repo PRs are
  # never affected.
  # one of: skip-init | full | refuse
  # untrusted: skip-init
  # Whether `sdlc pr review` runs the `setup` verb in the PR worktree on every
  # launch — created or reused — before the session starts. Idempotency is the
  # verb's own contract, so running it again on a reused worktree is cheap by
  # design. `--no-setup` skips it for one run.
  # setup: true
  # How `sdlc pr review` brings a reused worktree up to date before the
  # session starts. `update` (default): fetch, run `sdlc pr update --apply` on
  # a same-repo PR that is behind its base (this may push to the PR), then
  # fast-forward the worktree to the PR head. `pull`: fetch and fast-forward
  # only. `off`: leave the worktree as it is. A worktree with uncommitted
  # changes, or with commits the PR head lacks, is never touched.
  # `--no-refresh` acts as `off` for one run.
  # one of: update | pull | off
  # refresh: update
  # Whether `sdlc pr review` lists other open PRs that are stacked with the
  # reviewed one or change a shared path, in the prompt's `{related_prs}`
  # placeholder. The lookup fetches `origin` and diffs each candidate PR.
  # `false` skips it and the placeholder reads `none found`.
  # related_prs: true
  # How the review brief handed to the session is composed. See `mode` and
  # `text`.
  # prompt:
    # `extend` appends `text` after the built-in review brief; `replace` uses
    # `text` as the whole prompt. In either mode the placeholders
    # `{pr_number}`, `{pr_url}`, `{pr_title}`, `{pr_author}`, `{base}`,
    # `{head}`, `{repo}`, `{worktree}`, `{related_prs}` and `{default_prompt}`
    # resolve (unknown ones render empty), so a replacement can embed the
    # built-in brief wherever it likes.
    # one of: extend | replace
    # mode: extend
    # Project-specific review instructions. Empty (the default) leaves the
    # built-in brief unchanged in `extend` mode; in `replace` mode an empty
    # text is an error.
    # text: ''

# Notification channels and the event catalog that routes each event to zero
# or more of them. `notify(event, payload, ctx)`
# (`lib/services/notify/dispatch.ts`) resolves `events[event]` to channel
# names, looks each one up in `channels`, and dispatches best-effort per
# channel — one channel failing never suppresses another or fails the caller.
# `sdlc notify send|test` fires a named channel directly, bypassing event
# routing. This cross-field check assumes a fully-merged config; validating
# `sdlc.yaml` or `sdlc.local.yaml` alone (where the split may legitimately
# span both files) uses the un-refined `NotifyObjectSchema` (the `fileSchema`
# of this section) instead. A webhook channel `url` is a secret: the loader
# refuses it in the committed `sdlc.yaml`.
# notify:
  # Named notification channels, each an object discriminated by `type`:
  # `{type: "desktop"}` (no other fields — raises a notification on the
  # machine running the loop); `{type: "ntfy", topic_url}` (POSTs to an ntfy
  # HTTP topic URL); or `{type: "webhook", url, format?}` (POSTs a JSON body
  # to an arbitrary HTTP endpoint — `format` is `slack`, `discord`, or `raw`,
  # default `raw`). Each name is referenced by one or more `events.*` lists
  # below; a channel not referenced by any event is valid but inert.
  # channels: {}
  # Exactly the 15 canonical event names, each an ordered list of channel
  # names (from `channels` above) to fire when that event happens. An event
  # key that is absent, or set to `[]`, is a silent no-op — no channel call,
  # no error. An unknown event key is ignored with a warning.
  # events:
    # A PR classified NEEDS-RESPONSE has exhausted
    # `orchestrator.review.max_rounds` review/respond round-trips
    # (`ticks/_pr_action.ts`). Fires on every orchestrator tick thereafter for
    # as long as the PR stays stuck in that state — there is no dedup or
    # one-shot suppression, so a configured channel repeats this notification,
    # not just once.
    # pr.needs_response: []
    # A PR classified CI-FAILED has exhausted `orchestrator.review.max_rounds`
    # review/respond round-trips (`ticks/_pr_action.ts`). Fires on every
    # orchestrator tick thereafter for as long as the PR stays stuck in that
    # state — there is no dedup or one-shot suppression, so a configured
    # channel repeats this notification, not just once.
    # pr.ci_failed: []
    # A task's dispatch is stood down, whether by a blocking hook (`sdlc hooks
    # run` consumes a park marker for the task's branch) or by the `work`
    # tick's own step-failure handling when a dispatched workflow step fails
    # outright (`ticks/work.ts`). The payload carries a `focus` field, the
    # `sdlc session focus …` command for the task.
    # task.parked: []
    # A chain-labeled issue is already at its `sdlc:auto/<x>` autonomy ceiling
    # (the `issues` tick).
    # stage.ceiling_reached: []
    # A phase reached ready-for-review. No detector wired yet.
    # phase.ready_for_review: []
    # A lease expired (`sdlc lease reconcile`'s `expired-task-leases`
    # detector). `notifyExpiredLeaseAnomalies` (`reconcile.ts`) collapses
    # every anomaly found in ONE reconcile run into a single notify, but that
    # dedup does not persist across runs: the same still-expired lease fires
    # again on every subsequent `sdlc lease reconcile` run for as long as it
    # stays expired — there is no cross-run dedup or one-shot suppression, the
    # same unbounded-repeat shape as `pr.needs_response`/`pr.ci_failed` above.
    # lease.expired: []
    # An agent session ended: fires whenever a headless session record is
    # finalized. The orchestrate step-runner launching a headless skill/prompt
    # step for a workflow tick is the common case in practice; a direct `sdlc
    # session launch --headless` invocation is the other.
    # session.ended: []
    # An interactive Claude session entered `waiting_for_input` (a permission
    # or elicitation prompt, or an `AskUserQuestion`): fires once per entry
    # from the hook reporter (`sdlc session hook`), not on each repeated hook
    # while it stays waiting. The payload carries a `focus` field, the `sdlc
    # session focus …` command that brings the session forward.
    # session.waiting: []
    # An agent declared its session done with `sdlc session done` (`outcome`
    # is `ok` or `failed`). The session stays open for a next prompt; this is
    # not `session.ended`. The payload carries a `focus` field, the `sdlc
    # session focus …` command that brings the session forward.
    # session.done: []
    # An `on_fail: block` hook step failed (`sdlc hooks run`).
    # hook.blocked: []
    # The orchestrate loop stopped dead. No detector wired yet.
    # orchestrator.dead_stop: []
    # A usage.budget ceiling (tokens or cost_usd) was exceeded within its
    # rolling window AND the work tick actually had a ready candidate it would
    # otherwise have dispatched this tick (ticks/work.ts) — never fires while
    # already `orchestrate pause`d (that gate is the more informative status)
    # or when there was nothing ready to dispatch anyway. Still repeats every
    # tick that meets both conditions for as long as usage stays over the
    # ceiling — no one-shot-per-crossing suppression, but scoped to ticks
    # where the event's claim ("dispatch was suppressed") is actually true.
    # usage.budget_exceeded: []
    # The `work` tick found the tip of `origin/<target>` failing a
    # `orchestrator.base_health.commands` command and stopped dispatching new
    # work (`services/orchestrator/base-health.ts`). Fires once per (sha,
    # command), not once per tick, and not while the `work` loop is paused or
    # on a dry run. Runs already going continue.
    # orchestrator.base_red: []
    # The base-health check could not answer for a sha: a spawn error, a
    # timeout, or a failed fetch, worktree reset or install. Distinct from
    # `orchestrator.base_red`: no command failed, so nothing is cached red;
    # the check is retried after
    # `orchestrator.base_health.infra_retry_seconds` and the `work` tick
    # dispatches nothing until it has a verdict. Fires once per sha, not once
    # per retry, and not while paused or on a dry run.
    # orchestrator.base_unverified: []
    # The base turned green after a red one was announced (a new sha passed):
    # the `work` tick dispatches again. Fires once per recovery, and not while
    # paused or on a dry run.
    # orchestrator.base_green: []

# Token/cost usage reporting, the budget gate and the rate-limit cooldown cap.
# `budget` sets a rolling-window token/cost ceiling that pauses the work
# tick's dispatch and fires `usage.budget_exceeded` when exceeded. Absent, or
# present with `budget` absent (or both `budget.tokens`/`budget.cost_usd`
# unset), means no cap — inert, matching `notify.channels`' 'valid but inert'
# precedent.
# usage:
  # Token/cost ceiling that pauses the orchestrator work tick's dispatch and
  # fires usage.budget_exceeded when exceeded. Absent, or present with both
  # `tokens`/`cost_usd` unset, means no cap — inert, matching notify.channels'
  # 'valid but inert' precedent.
  # budget:
    # Rolling lookback window (hours, ending now) that budget totals are
    # summed over.
    # window_hours: 24
    # Total token ceiling, compared against a BILLABLE per-window sum:
    # UsageRow.inputTokens + outputTokens + cacheWriteTokens, nulls counting
    # as 0 — deliberately EXCLUDING cacheReadTokens (see
    # lib/services/usage/record.ts#sumBillableTokens). Cache reads dominate
    # raw usage and are far cheaper than fresh input, so a ceiling compared
    # against the cache-inclusive ledger total (UsageRow.totalTokens) would
    # trip within a single session. Unset: no token ceiling.
    # tokens:
    # Total USD cost ceiling (sum of UsageRow.costUsd, nulls counting as 0)
    # across rows inside the window. Only a headless Claude run ever populates
    # a non-null costUsd (claude -p --output-format json's own total_cost_usd)
    # — every interactive row and every codex row (headless or interactive) is
    # always costUsd: null, since codex reports no dollar figure and there is
    # no local price table. This ceiling therefore only ever caps
    # headless-Claude spend, not total spend. Unset: no cost ceiling.
    # cost_usd:
  # The longest a rate-limit cooldown (`.sdlc/cooldowns.json`) keeps a tool or
  # model out of routing, in hours. A reset time the tool reports further out,
  # or a stale entry further out, counts only this long; the tool is then
  # tried again and re-cooled if still limited. The writer clamps to it and
  # every reader applies it. Unset: 24.
  # cooldown_max_hours:

# Named schedules: each runs a workflow on a five-field cron expression, with
# a per-run time limit. Entries merge by `name` across `sdlc.yaml` and
# `sdlc.local.yaml`. A bad cron expression or time zone, an unknown workflow,
# a duplicate name or a missing `limits.minutes` refuses to load. Runs only
# while the orchestrator loop is on.
# schedules:

# Per-machine choice to keep the orchestrator running without a terminal: a
# launchd agent (macOS) or systemd user unit (Linux) that runs `sdlc
# orchestrate run` with restart on failure. Lives in `sdlc.local.yaml` only;
# unset installs nothing, and schedules then run only while `sdlc orchestrate
# run` is up. `sdlc apply` installs and removes the unit; `sdlc project
# doctor` flags a missing unit or one whose project moved.
# runner:
  # Which OS service manager runs `sdlc orchestrate run` for this project:
  # `launchd` (macOS user agent), `systemd` (Linux user unit) or `none` (no
  # runner; removes one `sdlc apply` installed earlier). A kind that does not
  # match this machine is reported and changes nothing.
  # one of: launchd | systemd | none
  # kind:
  # Root of this project's parent project, when it has one. Recorded with the
  # project in the machine's runner list; the runner itself does not use it.
  # parent:

# ── integration ─────────────────────────────────────────────────────────────

# Named, ordered tool preferences. An entry is a bare list of references
# (`[claude/opus, codex/max]`, tried in order) or the long form `{order, host,
# context}`; the launching command, not the profile, picks headless or
# interactive. A reference is `tool[/model][[qualifiers]][@effort]`: the tool
# is a model-catalogue tool id (claude | codex | cursor | antigravity | pi |
# opencode, or one `router.tools` declares), or `*` with a tier for every tool
# (`*/fast`, in a profile entry, a rule or a binding’s `tool:`); the model a
# tier (`fast` | `standard` | `max`) or a name; the qualifiers `ctx=<size>`
# (at least that much context: `1m`, `200k`, or `max`) and traits that filter
# a tier or wildcard (`local`, `agent`, `reasoning`, `long-context`); the
# effort a level the tool accepts (`codex/max@high`). Write `[ctx=1m]`, not a
# tool bracket such as `opus[1m]` or `[context=1m]`. `context:` asks every
# entry for at least that size, and an entry whose model cannot reach it is
# skipped. YAML quoting: a reference starting with `*` must be quoted
# (`"*/fast"`), and one containing `[` must be quoted inside a flow list
# (`["claude/opus[ctx=1m]", codex/max]`); block lists (`-
# claude/opus[ctx=1m]`) need no quotes. A workflow, `pr_review`, `verify` or a
# `routing:` rule names an entry with `profile:`. Two profiles are built in:
# `default` (`["*/standard"]`), what a launch uses when nothing else names a
# binding, and `small` (`["*/fast"]`); an entry of either name replaces the
# built-in whole. A wildcard expands to its category chain: tools in
# `router.chains.order`, and within a tool the models the classifier places in
# the tier, newest first, then larger context first. An unknown tool, a
# reference that does not parse, an effort the tool and model lack, a `[ctx=]`
# larger than the model offers anywhere, and a reference the model catalogue
# knows is impossible (`codex/sonnet`, with the nearest valid one) fail the
# load and name the entry; a model the catalogue does not know only warns,
# unless `router.strict`.
# profiles:

# Rules that choose a profile from what a launch is for, tried in order; the
# first whose `when` holds wins. Each rule is `{when, profile}`. `when` keys:
# `workflow` (the workflow name), `stage` (the chain stage, set when the
# `issues` loop advances one: capture | triage | define | ready | implement |
# check | judge | review | respond | merge | close-out), `complexity` (small |
# medium | large), `impact` (high | medium | low), `autonomy` (human-only |
# supervised | autonomous/pr) and `tags` (a list; holds when the task carries
# any of them). Every key a rule sets must hold, and a launch with no task (a
# bare `sdlc session launch --workflow`) holds only `workflow`. `profile`
# names a `profiles:` entry or a built-in one (`default`, `small`). A rule
# sits between the `--tool` flag and the workflow's own binding: the flag
# beats every rule, and a matching rule beats `workflows.<name>.profile|tool`,
# `pr_review` and `profiles.default`. The launch's trace names the rule
# (`rule[<index>]`) and its `route.chose` event records `via: rule:<index>`. A
# rule naming an undefined profile or a value outside its set fails the load
# and names the rule index; an unknown `when` key fails the load too (dropping
# it would widen the rule to match more launches); `sdlc project doctor` warns
# on a rule an earlier rule with the same or broader `when` always beats.
# Example: `routing: [{when: {workflow: implement, complexity: small},
# profile: small}]`.
# routing:

# Model catalogue facts layered over the snapshot `@sksizer/tool-router` ships
# and the machine catalogue `sdlc models refresh` writes, and the policy that
# maps tiers to models: `providers` (`{kind, endpoint, key_env}`; `key_env`
# names an environment variable, never a key), `tools` (a field replaces the
# built-in one, except `serves`, which adds; a new tool needs `serves`,
# `openness` and `modes`, and runs as the command its id names; a tool’s
# executable is not config, so `binary` fails the load; a declared tool is
# never run for `--version`, and its headless template runs only in a
# repository trusted with `sdlc repo trust`, else exits 21, `UNTRUSTED`),
# `offerings` (rows that add one tool and model combination, or remove one
# with `remove: true`), `strict` (default false: a model the catalogue does
# not know is a warning at launch and in `sdlc project doctor`; true makes it
# an error that refuses the load, while a deprecated model still only warns),
# and the mapping policy: `classify` (classifier rules tried before the
# shipped ones, each `{provider?, families?, match?, by_parameters?,
# require_traits?}`; the first that matches a model places it in `fast`,
# `standard`, `max` or `unclassified`, and a model no rule places is in no
# tier and no chain), `chains.order` (the tool order of every category chain;
# default claude, codex, cursor, antigravity, pi, opencode) and `pins`
# (`tool/tier: model`, such as `claude/max: claude-opus-5-5`, held whatever
# the classifier picks; a Claude Code launch also gets the pinned Claude tiers
# as `ANTHROPIC_DEFAULT_{OPUS,SONNET,HAIKU}_MODEL`). An unknown key in a
# `classify` rule or an `offerings` row, an incomplete new tool or provider, a
# row naming an unknown tool, provider or model, an unknown tool in
# `chains.order`, and a pin its tool cannot run fail the load; any other
# unknown key is ignored with a warning.
# router:
  # Providers to add or change: `{kind, endpoint, key_env}`.
  # providers:
  # Tools to add or change. A field replaces the built-in one, except
  # `serves`, which adds. A new tool needs `serves`, `openness` and `modes`,
  # and runs as the command its id names, found on PATH: a declared tool is
  # never run for `--version`, and is launched only in a trusted repository. A
  # tool’s executable is not config: a built-in tool runs as the snapshot
  # names it.
  # tools:
  # Rows that add one tool and model combination, or remove one (`remove:
  # true`).
  # offerings:
  # Refuse a model the catalogue does not know, instead of warning. A
  # deprecated model still only warns. Default false; CI should set it.
  # strict:
  # Classifier rules tried before the shipped ones; the first that matches a
  # model places it in a tier, or `unclassified`.
  # classify:
  # Category chain settings: `order`, the tool order.
  # chains:
    # Tool order in every category chain; tools left out follow in catalogue
    # order. Default claude, codex, cursor, antigravity, pi, opencode.
    # order:
  # `tool/tier` to the model that tier means on that tool (`claude/max:
  # claude-opus-5-5`), held whatever the classifier picks.
  # pins:

# Where this project's external work items live. Absent resolves to GitHub
# Issues, today's behaviour. The code host is named by `code_host`, not here.
# tracker:
  # Which tracker adapter `issues sync`, the `issues` tick and the label
  # applier use. Only `github` (GitHub Issues) exists; more kinds join with
  # their adapters.
  # one of: github
  # kind: github

# Which code host the PR commands, the orchestrator `prs` tick, `session
# focus` and `project doctor` talk to, via `selectCodeHost`. `pr survey`/`pr
# update` (the standalone `@sksizer/pr-update` package) and the dashboard read
# GitHub directly and do not consult this key yet. Every key has a default, so
# this block is optional.
# code_host:
  # Force which CodeHost adapter `selectCodeHost`'s callers use, bypassing
  # auto-detection from the `origin` remote's URL. Null (the default)
  # auto-detects: a `github.com` remote uses the GitHub adapter, anything else
  # uses Forgejo.
  # one of: github | forgejo
  # override: null

# The default host, the default session mode, and when sdlc closes host panes
# — see `host.default`, `host.session` and `host.close_pane`.
# host:
  # Where sdlc puts work in front of you when a feature does not say
  # otherwise: `terminal` runs it in the current terminal and returns when it
  # ends; `orca` opens a terminal tab in the Orca app; `cmux` opens a cmux
  # workspace; `tmux` opens a detached tmux session named from the sdlc
  # session id; `herdr`, `otty` and `wezterm` open a workspace or tab in that
  # terminal app; `vscode` and `jetbrains` open a terminal in the IDE window
  # that has the project open, through a companion extension or plugin. A host
  # that does not support this OS is unavailable. Every host runs whichever
  # agent CLI (the tool a `profile:` or `tool:` binding resolves to) the
  # feature resolves, in a terminal/workspace it opens — the two are
  # independent, not a fixed pairing. Every host fulfils the host contract in
  # parts (an agent session, a command in a terminal, a message sent into an
  # already-open one); a feature that needs a part the host lacks fails rather
  # than falling back. A feature's own `host` key (e.g. `pr_review.host`)
  # overrides this, and a `--host` flag overrides both.
  # one of: terminal | orca | cmux | tmux | herdr | otty | wezterm | vscode | jetbrains
  # default: terminal
  # Whether an orchestrated run opens in a host pane you can watch
  # (`interactive`) or runs detached (`headless`), for this machine. Set it in
  # `sdlc.local.yaml` for a person who always wants panes; a team may commit
  # it in `sdlc.yaml` as the repository default, and the local value wins.
  # Unset defers to the built-in `headless`. Precedence, strongest first: the
  # `--interactive` run flag, the task's `session:` field,
  # `workflows.<name>.session`, this setting, headless.
  # one of: interactive | headless
  # session:
  # When sdlc closes the host pane a session ran in (`tmux kill-session`,
  # `orca terminal close`, ...; hosts without a close command leave the pane
  # open). `on-close-out` (default): closing out a merged task (`sdlc task
  # close-commit`, before the worktree is removed) closes the panes of that
  # task branch's sessions. `on-done`: `sdlc session done` closes the
  # session's own pane as soon as the agent declares it done (the harness is
  # killed with a signal, so the wrapper records the outcome from `done`).
  # `never`: panes are left for you to close. Closing a pane ends whatever
  # still runs in it.
  # one of: on-close-out | on-done | never
  # close_pane: on-close-out

# Which agent harnesses `sdlc apply` installs sdlc into. A change here takes
# effect only after `sdlc apply` re-installs.
# harness:
  # Agent harnesses to install the sdlc plugin surface for, by exporter name
  # (`sdlc harness export --target` lists them). Absent means the harness
  # applier picks its default.
  # targets:

# Which ops the `sdlc mcp` stdio server exposes as tools. Safe default: only
# ops marked `mutating: false` are exposed; `allow` opts specific mutating ops
# in, `deny` excludes specific ops. `sdlc apply` registers the server with
# each harness, so a change to the registration takes effect only after it
# runs.
# mcp:
  # Additional op paths (space-joined, e.g. "task create") to expose as MCP
  # tools even though they are not marked mutating: false. Opt-in for mutating
  # ops.
  # allow: []
  # Op paths (space-joined) to exclude from the MCP tool set even if they
  # would otherwise qualify (e.g. a read-only op you don't want exposed).
  # deny: []

# Reserved for issue-tracker sync and the issues loop (sdlc 1.0 Phase 7). No
# field is defined yet.
# issues:

# ── planning ────────────────────────────────────────────────────────────────

# Task-domain configuration. Groups task-lifecycle execution policy under
# `execution` (see `execution.spawn_from_post_mortem`).
# task:
  # Configures how this project executes task-lifecycle automation. Today the
  # only sub-block is `spawn_from_post_mortem`.
  # execution:
    # Policy for converting a `/sdlc:task-work` post-mortem's friction bullets
    # into follow-up tasks. Missing block defaults to enabled, drive-to-ready,
    # landing undriveable follow-ups at `planning/draft`.
    # spawn_from_post_mortem:
      # Whether `/sdlc:task-work` Step 8 spawns follow-up tasks from the
      # post-mortem's 'Friction and automation gaps' bullets (the
      # spawn-from-post-mortem procedure, which hands each bullet to
      # `/sdlc:spawn-task-pr`). `true` (default) runs the spawn sub-step;
      # `false` skips it entirely — the post-mortem is still written and
      # committed, but no follow-up task or PR is created. A missing key
      # defaults to enabled.
      # enabled: true
      # Whether each spawned follow-up is driven toward `open/ready` before
      # its PR is opened. `true` (default) runs `/sdlc:task-auto-define` then
      # `/sdlc:task-ensure-ready` on the scaffolded task: when the spec can be
      # synthesized from the friction bullet plus codebase context AND passes
      # the readiness gate, ensure-ready promotes the task to `open/ready`
      # with `readiness_verified_at:` stamped. When auto-define reports
      # INSUFFICIENT the task lands at `fallback_status:`; when the gate finds
      # a gap it lands at `planning/needs-definition` — the drive is
      # best-effort, never fabricated. `false` skips the drive and always
      # lands the task at `fallback_status:`.
      # drive_to_ready: true
      # The status a spawned follow-up lands at when it is NOT driven to
      # `open/ready` — either because `drive_to_ready:` is false, or because
      # the best-effort drive's auto-define could not synthesize the spec (a
      # spec that fails the readiness gate lands at
      # `planning/needs-definition` instead). Must be a non-ready `planning/*`
      # status; default `planning/draft` (today's behavior). Set
      # `planning/needs-definition` to route undriveable follow-ups straight
      # into the definition backlog — note that with `drive_to_ready: true`
      # this value also skips the drive entirely (`planning/needs-definition`
      # is not a status `/sdlc:task-ensure-ready` accepts as input), landing
      # the follow-up there directly instead of attempting the gate.
      # one of: planning/draft | planning/needs-definition | planning/proposed | planning/backlog
      # fallback_status: planning/draft
      # Controls which PR a spawned follow-up lands in and how that PR is
      # titled. See `pr_grouping` and `pr_title_pattern`.
      # target:
        # How spawned follow-up tasks are packaged into PRs (per target repo —
        # classification routes Local / Upstream-plugin /
        # Cross-project-request follow-ups to different repos, and a PR cannot
        # span repos). `per-task` (default, today's behavior): one PR per
        # spawned task. `per-execution`: one PR per `/sdlc:task-work` run
        # bundling all that run's follow-ups for a repo. `per-project`: a
        # single rolling PR per repo that accumulates follow-ups across runs
        # (append to the open PR, or start a fresh one — the `sdlc backlog
        # create` rolling pattern).
        # one of: per-task | per-execution | per-project
        # pr_grouping: per-task
        # Optional template for the spawned PR's title. Placeholders resolved
        # at PR-creation time (unknown ones render empty): `{headline}`
        # (spawned task headline), `{slug}`, `{originating_task}`,
        # `{classification}`, `{date}` (UTC), `{repo}` (owner/name). Absent →
        # each grouping mode uses its built-in default: `per-task` = the task
        # headline (today's behavior); `per-execution` = `chore(tasks):
        # follow-ups from {originating_task}`; `per-project` = `chore(tasks):
        # spawned follow-up tasks`. Note `{originating_task}` is meaningful
        # only for `per-task`/`per-execution` — a `per-project` rolling PR
        # spans many runs, so a per-run token there resolves to the run that
        # first opened it.
        # pr_title_pattern:

# Backlog-domain configuration. Groups backlog-capture submission policy under
# `capture` (see `capture.target`).
# backlog:
  # Policy for `sdlc backlog create` — the deterministic tail behind
  # `/sdlc:backlog-capture`. Missing block defaults to enabled, per-project
  # (rolling) grouping.
  # capture:
    # Whether `sdlc backlog create` (the `/sdlc:backlog-capture` tail)
    # auto-submits the captured item to a PR. `true` (default) authors the
    # file, commits it in an ephemeral worktree, pushes, and opens-or-updates
    # a PR — today's behavior. `false` authors the file in the working tree
    # and stops (no commit, no push, no PR) — the item is captured locally for
    # the author to submit by hand.
    # enabled: true
    # Controls which PR a captured backlog item lands in and how that PR is
    # titled. See `pr_grouping` and `pr_title_pattern`.
    # target:
      # How captured backlog items are packaged into PRs. `per-project`
      # (default, today's behavior): a single rolling `backlog-capture` PR
      # that accumulates every captured item until triaged. `per-item`: one
      # branch/PR per captured item (`backlog/<slug>`), so each idea is
      # reviewed on its own. (No `per-execution` — backlog capture has no run
      # to bundle.)
      # one of: per-project | per-item
      # pr_grouping: per-project
      # Optional template for the backlog PR's title, resolved when the PR is
      # created (placeholders, unknown → empty): `{id}` (B-NNNN), `{slug}`,
      # `{title}` (headline), `{date}` (UTC). Absent → each grouping mode's
      # default: `per-project` = `docs(backlog): rolling capture`; `per-item`
      # = `docs(backlog): {title}`. For a `per-project` rolling PR the title
      # is fixed by the item that first opened it.
      # pr_title_pattern:

# Reserved for knowledge-base settings. No field is defined yet.
# knowledge:

